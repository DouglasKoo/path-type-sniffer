[project]
name = "path-type-sniffer"
version = "0.1.1"
description = "Classifies a path as file, directory, symlink, broken symlink, socket, fifo, or device without raising on missing entries."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
